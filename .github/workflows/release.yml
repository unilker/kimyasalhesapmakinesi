name: Release build

# Builds the Play Store bundle signed with the upload key kept in the
# repository secrets (see docs/RELEASE.md). Run it from the Actions tab or
# by pushing a tag such as v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret for $v is missing; see docs/RELEASE.md"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: flutter build appbundle --release
      - name: Check that the bundle is signed with the upload key
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee cert.txt
          if ! grep -q "^Owner:" cert.txt; then
            echo "::error::The bundle is not signed"
            exit 1
          fi
          if grep -q "CN=Android Debug" cert.txt; then
            echo "::error::The bundle is signed with the debug key"
            exit 1
          fi
      - name: Remove the key from the runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
