name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Cross-check solvers against an independent reference
        run: |
          flutter test tool/crosscheck/dump_solvers_test.dart
          python3 tool/crosscheck/check_solvers.py tool/crosscheck/out_solvers.json
      - name: Cross-check the expression parser against Python
        run: |
          python3 tool/crosscheck/expressions.py gen tool/crosscheck/out_expr_in.json
          flutter test tool/crosscheck/eval_expressions_test.dart
          python3 tool/crosscheck/expressions.py check tool/crosscheck/out_expr_out.json
      - name: Cross-check unit factors against pint
        run: |
          pip install pint
          python3 tool/crosscheck/check_units.py

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
